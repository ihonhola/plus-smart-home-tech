spring:
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
      - id: shopping-cart-route
        uri: lb://shopping-cart
        predicates:
          - Path=/shopping-cart/**
        filters:
          - PrefixPath=/api/v1
      - id: shopping-store-route
        uri: lb://shopping-store
        predicates:
          - Path=/shopping-store/**
        filters:
          - PrefixPath=/api/v1
          - name: Retry
            args:
              retries: 3
              statuses: NOT_FOUND
              methods: GET
      - id: shopping-cart-circuitbreaker-route
        uri: lb://shopping-cart
        predicates:
          - Path=/shopping-cart/**
        filters:
          - PrefixPath=/api/v1
          - name: CircuitBreaker
            args:
              name: myCircuitBreaker
              fallbackUri: forward:/fallback/shopping-cart

server:
  port: 8080

